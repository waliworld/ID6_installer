name: Build client program

# Produces the standalone double-click programs (no Python needed by clients).
#
# TWO WAYS TO RUN THIS, both from your browser - no command line:
#   1. Actions tab -> "Build client program" -> "Run workflow".  When it finishes,
#      open the run and download the .exe from the "Artifacts" section.
#   2. Publish a version tag (e.g. v0.3.0) to also attach the files to a Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: TunedByWali-NBT-Toolbox.exe
            asset: TunedByWali-NBT-Toolbox-windows-x64.exe
          - os: macos-latest
            out: TunedByWali-NBT-Toolbox
            asset: TunedByWali-NBT-Toolbox-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/toolbox.spec
      - name: Smoke test (it starts and serves)
        shell: bash
        run: |
          "dist/${{ matrix.out }}" --no-browser --port 8799 &
          PID=$!
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/ || echo 000)
          curl -s -X POST http://127.0.0.1:8799/quit -d '{}' || true
          kill $PID 2>/dev/null || true
          echo "HTTP $code"
          test "$code" = "200"
      - name: Name the artifact
        shell: bash
        run: cp "dist/${{ matrix.out }}" "${{ matrix.asset }}"
      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Double-click programs for the TunedByWali NBT Evo Toolbox — no Python needed.
            - Windows: download the `.exe`, double-click, allow it past SmartScreen (unsigned).
            - macOS: download, right-click → Open the first time (unsigned).
            OpenSSH (built into Windows 10/11 and macOS) is the only requirement.
