name: Build toolbox executables

# Produces the double-click programs end users download. Runs on real Windows
# and macOS machines, so these are genuine native executables that need no
# Python install. Triggered by pushing a version tag (e.g. v0.3.0) or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TunedByWali-NBT-Toolbox-windows-x64.exe
            built: dist/TunedByWali-NBT-Toolbox.exe
          - os: macos-latest
            artifact: TunedByWali-NBT-Toolbox-macos
            built: dist/TunedByWali-NBT-Toolbox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: pyinstaller packaging/toolbox.spec
      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Double-click programs for the TunedByWali NBT Evo Toolbox — no Python needed.
            - Windows: download the `.exe`, double-click, allow it past SmartScreen (unsigned).
            - macOS: download, right-click → Open the first time (unsigned).
            OpenSSH is the only system requirement (built into Windows 10/11 and macOS).
